<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dépenses Road Trip</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #F5F0E8; color: #2C2416; padding-bottom: 80px; }

header { background: #2C2416; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
header h1 { color: #F5F0E8; font-size: 16px; font-weight: 600; }
header h1 span { color: #C8622A; }
#compteur { background: #C8622A; color: white; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }

.page { max-width: 480px; margin: 0 auto; padding: 12px; }
.card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.card-title { font-size: 11px; font-weight: 700; color: #8A95A5; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 14px; }

.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; font-weight: 600; color: #8A95A5; margin-bottom: 5px; text-transform: uppercase; }
.field input, .field select, .field textarea {
  width: 100%; padding: 12px; border: 2px solid #E0DBD0; border-radius: 10px;
  font-size: 16px; color: #2C2416; background: #F9F7F3; outline: none;
  -webkit-appearance: none; appearance: none; font-family: inherit;
}
.field textarea { min-height: 60px; resize: vertical; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Checkboxes participants */
.checks { display: flex; flex-direction: column; gap: 0; margin-top: 4px; border: 2px solid #E0DBD0; border-radius: 10px; overflow: hidden; }
.check-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: white; border-bottom: 1px solid #F0EDE6; }
.check-row:last-child { border-bottom: none; }
.check-row input[type=checkbox] {
  width: 24px; height: 24px; flex-shrink: 0;
  accent-color: #1A7A65;
  cursor: pointer;
  margin: 0;
}
.check-row label { font-size: 16px; font-weight: 500; cursor: pointer; flex: 1; padding: 2px 0; }
.check-row.checked { background: #E0F2EE; }

/* Bouton */
button.btn-main {
  display: block; width: 100%; padding: 16px;
  background: #C8622A; color: white; border: none; border-radius: 12px;
  font-size: 17px; font-weight: 700; font-family: inherit;
  cursor: pointer;
}

/* Liste */
.dep-item { background: white; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; display: flex; gap: 12px; align-items: flex-start; box-shadow: 0 1px 6px rgba(0,0,0,.07); }
.dep-montant { font-size: 20px; font-weight: 800; color: #C8622A; white-space: nowrap; }
.dep-info { flex: 1; }
.dep-desc { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.dep-meta { font-size: 12px; color: #8A95A5; }
.dep-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.tag { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; background: #E0F2EE; color: #1A7A65; }
.tag-gray { background: #f0f2f5; color: #5A6475; }
button.btn-del { background: none; border: none; color: #ccc; font-size: 20px; cursor: pointer; padding: 2px 6px; }

.empty { text-align: center; padding: 30px; color: #8A95A5; font-size: 14px; }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
button.btn-act { padding: 14px; border: none; border-radius: 12px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; }
button.btn-exp { background: #1A7A65; color: white; }
button.btn-imp { background: #E0DBD0; color: #2C2416; }

.solde-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #F5F0E8; font-size: 13px; }
.solde-row:last-child { border: none; }
.pos { color: #2E7D32; font-weight: 700; }
.neg { color: #C0392B; font-weight: 700; }

#debug { position: fixed; bottom: 0; left: 0; right: 0; background: #111; color: #0f0; font-size: 11px; padding: 6px 10px; max-height: 100px; overflow-y: auto; z-index: 9999; font-family: monospace; }
</style>
</head>
<body>

<header>
  <h1>Road Trip <span>USA</span> · Dépenses</h1>
  <div id="compteur">0</div>
</header>

<div class="page">

  <div class="card">
    <div class="card-title">Nouvelle dépense</div>

    <div class="field">
      <label>Description *</label>
      <input type="text" id="f-desc" placeholder="Restaurant, Entrée parc…" autocomplete="off">
    </div>

    <div class="field-row">
      <div class="field">
        <label>Montant € *</label>
        <input type="number" id="f-montant" placeholder="0.00" inputmode="decimal" min="0" step="0.01">
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="f-date">
      </div>
    </div>

    <div class="field">
      <label>Payé par *</label>
      <select id="f-payepar">
        <option value="">— Choisir —</option>
        <option>Éric</option>
        <option>Pascale</option>
        <option>Carole</option>
        <option>Léa</option>
      </select>
    </div>

    <div class="field">
      <label>Participants</label>
      <div class="checks" id="checks">
        <div class="check-row" id="row-tous">
          <input type="checkbox" id="cb-tous" checked>
          <label for="cb-tous">Tous</label>
        </div>
        <div class="check-row" id="row-eric">
          <input type="checkbox" id="cb-eric" value="Éric">
          <label for="cb-eric">Éric</label>
        </div>
        <div class="check-row" id="row-pascale">
          <input type="checkbox" id="cb-pascale" value="Pascale">
          <label for="cb-pascale">Pascale</label>
        </div>
        <div class="check-row" id="row-carole">
          <input type="checkbox" id="cb-carole" value="Carole">
          <label for="cb-carole">Carole</label>
        </div>
        <div class="check-row" id="row-lea">
          <input type="checkbox" id="cb-lea" value="Léa">
          <label for="cb-lea">Léa</label>
        </div>
      </div>
    </div>

    <div class="field">
      <label>Mode paiement</label>
      <select id="f-mode">
        <option value="">— Optionnel —</option>
        <option>Carte bancaire</option>
        <option>Espèces</option>
        <option>Virement</option>
      </select>
    </div>

    <div class="field">
      <label>Note</label>
      <textarea id="f-note" placeholder="Précisions…"></textarea>
    </div>

    <button class="btn-main" id="btn-add">＋ Ajouter la dépense</button>
  </div>

  <div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div style="font-size:14px;font-weight:700;">Dépenses enregistrées</div>
      <div id="total" style="font-size:14px;font-weight:700;color:#C8622A;"></div>
    </div>
    <div id="liste"></div>
  </div>

  <div class="card" id="soldes-card" style="display:none;margin-top:4px;">
    <div class="card-title">Soldes provisoires</div>
    <div id="soldes"></div>
  </div>

  <div class="actions">
    <button class="btn-act btn-exp" id="btn-exp">⬇ Exporter JSON</button>
    <button class="btn-act btn-imp" id="btn-imp">⬆ Importer JSON</button>
  </div>
  <input type="file" id="f-import" accept=".json" style="display:none">

</div>

<div id="debug"></div>

<script>
const PARTS = ['Éric','Pascale','Carole','Léa'];
const KEY = 'rt_dep_v3';
let data = [];

function log(msg) {
  const d = document.getElementById('debug');
  const line = document.createElement('div');
  line.textContent = new Date().toLocaleTimeString('fr') + ' ' + msg;
  d.insertBefore(line, d.firstChild);
}

// Init
log('init start');
try {
  document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
  const s = localStorage.getItem(KEY);
  if (s) { data = JSON.parse(s); log('loaded ' + data.length + ' items'); }
} catch(e) { log('init error: ' + e.message); }
render();
log('init done');

// Checkboxes participants
const cbTous = document.getElementById('cb-tous');
const cbIndiv = ['cb-eric','cb-pascale','cb-carole','cb-lea'].map(id => document.getElementById(id));

function syncVisuel() {
  // Met à jour la classe .checked sur chaque ligne selon l'état de la checkbox
  document.getElementById('row-tous').classList.toggle('checked', cbTous.checked);
  cbIndiv.forEach(cb => {
    const row = document.getElementById('row-' + cb.id.replace('cb-',''));
    if (row) row.classList.toggle('checked', cb.checked);
  });
  log('syncVisuel: tous=' + cbTous.checked + ' indiv=' + cbIndiv.map(c=>c.value+'='+c.checked).join(','));
}

cbTous.addEventListener('change', function() {
  if (this.checked) {
    // Décocher tous les individuels
    cbIndiv.forEach(cb => { cb.checked = false; });
  } else {
    // Si on décoche Tous sans rien d'autre → remettre Tous
    this.checked = true;
  }
  syncVisuel();
});

cbIndiv.forEach(cb => {
  cb.addEventListener('change', function() {
    // Décocher Tous si un individuel est coché
    if (this.checked) cbTous.checked = false;
    // Si plus rien de coché → remettre Tous
    const anyChecked = cbIndiv.some(c => c.checked);
    if (!anyChecked) cbTous.checked = true;
    syncVisuel();
  });
});

// Init : Tous coché par défaut
cbTous.checked = true;
cbIndiv.forEach(cb => { cb.checked = false; });
syncVisuel();

function getParticipants() {
  if (cbTous.checked) return [...PARTS];
  return cbIndiv.filter(cb => cb.checked).map(cb => cb.value);
}

// Bouton Ajouter
log('attaching btn-add listener');
document.getElementById('btn-add').addEventListener('click', function(e) {
  log('btn-add CLICK fired');
  const desc    = document.getElementById('f-desc').value.trim();
  const montant = parseFloat(document.getElementById('f-montant').value);
  const payepar = document.getElementById('f-payepar').value;
  const date    = document.getElementById('f-date').value;
  const mode    = document.getElementById('f-mode').value;
  const note    = document.getElementById('f-note').value.trim();
  const parts   = getParticipants();

  log('desc=' + desc + ' montant=' + montant + ' payepar=' + payepar);

  if (!desc)    { log('ERR: no desc'); alert('Description manquante'); return; }
  if (!montant || montant <= 0) { log('ERR: bad montant'); alert('Montant invalide'); return; }
  if (!payepar) { log('ERR: no payepar'); alert('Payé par manquant'); return; }

  const entry = {
    id: Date.now(), label: desc, montant, payepar,
    participants: parts, date, modepay: mode, note,
    perso: parts.length === 1 ? 'perso' : 'groupe',
    _at: new Date().toISOString()
  };
  log('saving entry: ' + JSON.stringify(entry).slice(0,80));
  data.unshift(entry);
  try { localStorage.setItem(KEY, JSON.stringify(data)); log('saved to localStorage'); } catch(e) { log('save error: ' + e.message); }
  render();
  resetForm();
  log('done');
});

// Supprimer
document.getElementById('liste').addEventListener('click', function(e) {
  const btn = e.target.closest('.btn-del');
  if (!btn) return;
  data = data.filter(d => d.id !== parseInt(btn.dataset.id));
  localStorage.setItem(KEY, JSON.stringify(data));
  render();
  log('deleted');
});

// Export
document.getElementById('btn-exp').addEventListener('click', function() {
  log('export click');
  if (!data.length) { alert('Aucune dépense'); return; }
  const ts = new Date().toISOString().slice(0,16).replace('T','-').replace(':','h');
  const blob = new Blob([JSON.stringify({ _source:'roadtrip-offline', _at: new Date().toISOString(), payments: data }, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'depenses-' + ts + '.json';
  a.click();
  log('exported');
});

// Import
document.getElementById('btn-imp').addEventListener('click', function() {
  document.getElementById('f-import').click();
});
document.getElementById('f-import').addEventListener('change', function() {
  const file = this.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const json = JSON.parse(e.target.result);
      const payments = Array.isArray(json) ? json : (json.payments || []);
      const ids = new Set(data.map(d => String(d.id)));
      let n = 0;
      payments.forEach(p => { if (!ids.has(String(p.id))) { data.push(p); n++; } });
      localStorage.setItem(KEY, JSON.stringify(data));
      render();
      log('imported ' + n);
      alert(n + ' dépense(s) importée(s)');
    } catch(err) { log('import error: ' + err.message); alert('Fichier invalide'); }
  };
  reader.readAsText(file);
  this.value = '';
});

function resetForm() {
  document.getElementById('f-desc').value = '';
  document.getElementById('f-montant').value = '';
  document.getElementById('f-note').value = '';
  document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
  cbIndiv.forEach(cb => { cb.checked = false; updateRow(cb); });
  cbTous.checked = true;
  document.getElementById('row-tous').classList.add('checked');
}

function render() {
  log('render() called, data.length=' + data.length);
  const liste = document.getElementById('liste');
  if (!liste) { log('ERR: liste element not found'); return; }
  const total = data.reduce((s,d) => s + (d.montant||0), 0);
  document.getElementById('compteur').textContent = data.length;
  document.getElementById('total').textContent = data.length ? total.toFixed(2) + ' €' : '';

  if (!data.length) {
    liste.innerHTML = '<div class="empty">🧾 Aucune dépense enregistrée</div>';
    document.getElementById('soldes-card').style.display = 'none';
    return;
  }

  try {
  liste.innerHTML = data.map(d => {
    const dateStr = d.date ? new Date(d.date+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'}) : '';
    const parts = (d.participants||[]).join(', ');
    return '<div class="dep-item">'
      + '<div><div class="dep-montant">' + (d.montant||0).toFixed(2) + ' €</div></div>'
      + '<div class="dep-info">'
      + '<div class="dep-desc">' + (d.label||'') + '</div>'
      + '<div class="dep-meta">' + (dateStr ? dateStr + ' · ' : '') + (d.payepar||'') + '</div>'
      + '<div class="dep-tags"><span class="tag">' + parts + '</span>'
      + (d.modepay ? '<span class="tag tag-gray">' + d.modepay + '</span>' : '')
      + (d.note ? '<span class="tag tag-gray">' + d.note + '</span>' : '')
      + '</div></div>'
      + '<button class="btn-del" data-id="' + d.id + '">✕</button>'
      + '</div>';
  }).join('');
  log('render: liste.innerHTML set, length=' + liste.innerHTML.length);
  } catch(e) { log('render ERROR: ' + e.message); }

  renderSoldes();
}

function renderSoldes() {
  const paye = {}, doit = {};
  PARTS.forEach(p => { paye[p] = 0; doit[p] = 0; });
  data.forEach(d => {
    const parts = d.participants && d.participants.length ? d.participants : PARTS;
    const m = d.montant || 0;
    if (paye[d.payepar] !== undefined) paye[d.payepar] += m;
    parts.forEach(p => { if (doit[p] !== undefined) doit[p] += m / parts.length; });
  });
  let html = '';
  PARTS.forEach(p => {
    const s = (paye[p] || 0) - (doit[p] || 0);
    if (Math.abs(s) < 0.01) return;
    html += `<div class="solde-row"><span>${p}</span><span class="${s>0?'pos':'neg'}">${s>0?'+':''}${s.toFixed(2)} €</span></div>`;
  });
  const card = document.getElementById('soldes-card');
  if (!html) { card.style.display = 'none'; return; }
  document.getElementById('soldes').innerHTML = html;
  card.style.display = 'block';
}
</script>
</body>
</html>
