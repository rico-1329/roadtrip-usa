<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dépenses Road Trip</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; background: #F5F0E8; color: #2C2416; min-height: 100vh; }

header { background: #2C2416; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
header h1 { color: #F5F0E8; font-size: 16px; font-weight: 600; }
header h1 span { color: #C8622A; }
#compteur { background: #C8622A; color: white; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }

.page { max-width: 480px; margin: 0 auto; padding: 12px; }

.card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.card-title { font-size: 11px; font-weight: 700; color: #8A95A5; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 14px; }

.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; font-weight: 600; color: #8A95A5; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }
.field input, .field select, .field textarea {
  width: 100%; padding: 12px; border: 2px solid #E0DBD0; border-radius: 10px;
  font-family: inherit; font-size: 16px; color: #2C2416; background: #F9F7F3;
  outline: none; appearance: none; -webkit-appearance: none;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: #C8622A; background: white; }
.field textarea { min-height: 70px; resize: vertical; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.chip {
  padding: 10px 16px; border-radius: 24px;
  border: 2px solid #E0DBD0; background: #F5F0E8;
  font-size: 14px; font-weight: 500; color: #5A6475;
  cursor: pointer; user-select: none;
  transition: all .1s;
  min-height: 44px; min-width: 60px;
  display: flex; align-items: center; justify-content: center;
}
.chip.on { border-color: #1A7A65; background: #E0F2EE; color: #1A7A65; font-weight: 700; }

/* Bouton */
#btn-add {
  width: 100%; padding: 16px; border: none; border-radius: 12px;
  background: #C8622A; color: white;
  font-family: inherit; font-size: 16px; font-weight: 700;
  cursor: pointer; touch-action: manipulation;
  min-height: 52px;
}
#btn-add:active { background: #a84e20; }

/* Liste */
.dep-item { background: white; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.07); display: flex; gap: 12px; align-items: flex-start; }
.dep-montant { font-size: 20px; font-weight: 800; color: #C8622A; white-space: nowrap; }
.dep-montant small { font-size: 12px; font-weight: 500; }
.dep-info { flex: 1; }
.dep-desc { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.dep-meta { font-size: 12px; color: #8A95A5; }
.dep-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
.tag { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; background: #E0F2EE; color: #1A7A65; }
.btn-del { background: none; border: none; color: #E0DBD0; font-size: 18px; cursor: pointer; padding: 4px; touch-action: manipulation; }
.btn-del:active { color: #C0392B; }

.empty { text-align: center; padding: 30px; color: #8A95A5; }

/* Actions */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
.btn-act {
  padding: 14px; border: none; border-radius: 12px;
  font-family: inherit; font-size: 14px; font-weight: 700;
  cursor: pointer; touch-action: manipulation; min-height: 48px;
}
.btn-act:active { opacity: .7; }
.btn-exp { background: #1A7A65; color: white; }
.btn-imp { background: #E0DBD0; color: #2C2416; }

/* Toast */
#toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: #2C2416; color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; opacity: 0; transition: all .25s; pointer-events: none; white-space: nowrap; z-index: 100; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Soldes */
.solde-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #F5F0E8; font-size: 13px; }
.solde-row:last-child { border: none; }
.pos { color: #2E7D32; font-weight: 700; }
.neg { color: #C0392B; font-weight: 700; }
</style>
</head>
<body>

<header>
  <h1>Road Trip <span>USA</span> · Dépenses</h1>
  <div id="compteur">0</div>
</header>

<div class="page">

  <div class="card">
    <div class="card-title">Nouvelle dépense</div>

    <div class="field">
      <label>Description *</label>
      <input type="text" id="f-desc" placeholder="Restaurant, Entrée parc…" autocomplete="off">
    </div>

    <div class="field-row">
      <div class="field">
        <label>Montant € *</label>
        <input type="number" id="f-montant" placeholder="0.00" inputmode="decimal" min="0" step="0.01">
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="f-date">
      </div>
    </div>

    <div class="field">
      <label>Payé par *</label>
      <select id="f-payepar">
        <option value="">— Choisir —</option>
        <option>Éric</option>
        <option>Pascale</option>
        <option>Carole</option>
        <option>Léa</option>
      </select>
    </div>

    <div class="field">
      <label>Participants</label>
      <div class="chips" id="chips">
        <div class="chip on" data-v="tous">Tous</div>
        <div class="chip" data-v="Éric">Éric</div>
        <div class="chip" data-v="Pascale">Pascale</div>
        <div class="chip" data-v="Carole">Carole</div>
        <div class="chip" data-v="Léa">Léa</div>
      </div>
    </div>

    <div class="field">
      <label>Mode paiement</label>
      <select id="f-mode">
        <option value="">— Optionnel —</option>
        <option>Carte bancaire</option>
        <option>Espèces</option>
        <option>Virement</option>
      </select>
    </div>

    <div class="field">
      <label>Note</label>
      <textarea id="f-note" placeholder="Précisions…"></textarea>
    </div>

    <button id="btn-add">＋ Ajouter</button>
  </div>

  <div id="liste-wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div style="font-size:14px;font-weight:700;">Dépenses</div>
      <div id="total" style="font-size:14px;font-weight:700;color:#C8622A;"></div>
    </div>
    <div id="liste"></div>
  </div>

  <div class="card" id="soldes-card" style="display:none;margin-top:4px;">
    <div class="card-title">Soldes provisoires</div>
    <div id="soldes"></div>
  </div>

  <div class="actions">
    <button class="btn-act btn-exp" id="btn-exp">⬇ Exporter JSON</button>
    <button class="btn-act btn-imp" id="btn-imp">⬆ Importer JSON</button>
  </div>
  <input type="file" id="f-import" accept=".json" style="display:none">

</div>

<div id="toast"></div>
<div id="debug" style="position:fixed;bottom:0;left:0;right:0;background:#000;color:#0f0;font-size:11px;padding:6px 10px;max-height:120px;overflow-y:auto;z-index:999;font-family:monospace;"></div>

<script>
const PARTS = ['Éric','Pascale','Carole','Léa'];
const KEY   = 'rt_depenses_v2';
let data    = [];

// ── Init ──
document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
log('PAGE LOADED - data=' + data.length + ' entries');
try { const s = localStorage.getItem(KEY); if (s) data = JSON.parse(s); } catch(e) {}
render();

// ── Chips ──
document.getElementById('chips').addEventListener('click', function(e) {
  log('CHIP CLICK target=' + e.target.tagName + ' v=' + (e.target.dataset.v||'?'));
  const chip = e.target.closest('.chip');
  if (!chip) { log('no chip found'); return; }
  const v = chip.dataset.v;
  if (v === 'tous') {
    this.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    chip.classList.add('on');
  } else {
    this.querySelector('[data-v="tous"]').classList.remove('on');
    chip.classList.toggle('on');
    const any = Array.from(this.querySelectorAll('.chip:not([data-v="tous"])')).some(c => c.classList.contains('on'));
    if (!any) { this.querySelectorAll('.chip').forEach(c => c.classList.remove('on')); this.querySelector('[data-v="tous"]').classList.add('on'); }
  }
});

function getChips() {
  const tous = document.querySelector('#chips [data-v="tous"]').classList.contains('on');
  if (tous) return [...PARTS];
  return Array.from(document.querySelectorAll('#chips .chip:not([data-v="tous"]).on')).map(c => c.dataset.v);
}

// ── Ajouter ──
document.getElementById('btn-add').addEventListener('click', function() {
  log('BTN-ADD clicked');
  const desc    = document.getElementById('f-desc').value.trim();
  const montant = parseFloat(document.getElementById('f-montant').value);
  const payepar = document.getElementById('f-payepar').value;
  const date    = document.getElementById('f-date').value;
  const mode    = document.getElementById('f-mode').value;
  const note    = document.getElementById('f-note').value.trim();
  const parts   = getChips();

  log('desc='+desc+' montant='+montant+' payepar='+payepar);
  if (!desc)           return toast('⚠ Description manquante');
  if (!montant || montant <= 0) return toast('⚠ Montant invalide');
  if (!payepar)        return toast('⚠ Payé par manquant');

  data.unshift({ id: Date.now(), label: desc, montant, payepar, participants: parts, date, modepay: mode, note, perso: parts.length === 1 ? 'perso' : 'groupe', _at: new Date().toISOString() });
  save(); render(); reset();
  toast('✓ Dépense ajoutée');
});

// ── Supprimer ──
document.getElementById('liste').addEventListener('click', function(e) {
  const btn = e.target.closest('.btn-del');
  if (!btn) return;
  const id = parseInt(btn.dataset.id);
  data = data.filter(d => d.id !== id);
  save(); render();
  toast('Supprimée');
});

// ── Export ──
document.getElementById('btn-exp').addEventListener('click', function() {
  if (!data.length) return toast('Aucune dépense');
  const ts = new Date().toISOString().slice(0,16).replace('T','-').replace(':','h');
  const blob = new Blob([JSON.stringify({ _source:'roadtrip-offline', _at: new Date().toISOString(), payments: data }, null, 2)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'depenses-' + ts + '.json'; a.click();
  toast('✓ Export téléchargé');
});

// ── Import ──
document.getElementById('btn-imp').addEventListener('click', function() {
  document.getElementById('f-import').click();
});
document.getElementById('f-import').addEventListener('change', function() {
  const file = this.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const json = JSON.parse(e.target.result);
      const payments = Array.isArray(json) ? json : (json.payments || []);
      const ids = new Set(data.map(d => String(d.id)));
      let n = 0;
      payments.forEach(p => { if (!ids.has(String(p.id))) { data.push(p); n++; } });
      save(); render();
      toast('✓ ' + n + ' dépense' + (n>1?'s':'') + ' importée' + (n>1?'s':''));
    } catch(err) { toast('❌ Fichier invalide'); }
  };
  reader.readAsText(file);
  this.value = '';
});

// ── Reset ──
function reset() {
  document.getElementById('f-desc').value = '';
  document.getElementById('f-montant').value = '';
  document.getElementById('f-note').value = '';
  document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
log('PAGE LOADED - data=' + data.length + ' entries');
  document.querySelectorAll('#chips .chip').forEach(c => c.classList.remove('on'));
  document.querySelector('#chips [data-v="tous"]').classList.add('on');
}

// ── Save ──
function save() { localStorage.setItem(KEY, JSON.stringify(data)); }

// ── Render ──
function render() {
  const liste = document.getElementById('liste');
  const total = data.reduce((s,d) => s + d.montant, 0);
  document.getElementById('compteur').textContent = data.length;
  document.getElementById('total').textContent = data.length ? total.toFixed(2) + ' €' : '';

  if (!data.length) {
    liste.innerHTML = '<div class="empty">🧾<br>Aucune dépense</div>';
    document.getElementById('soldes-card').style.display = 'none';
    return;
  }

  liste.innerHTML = data.map(d => {
    const date = d.date ? new Date(d.date+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'}) : '';
    return `<div class="dep-item">
      <div>
        <div class="dep-montant">${d.montant.toFixed(2)}<small> €</small></div>
      </div>
      <div class="dep-info">
        <div class="dep-desc">${d.label}</div>
        <div class="dep-meta">${date ? date + ' · ' : ''}${d.payepar}</div>
        <div class="dep-tags"><span class="tag">${(d.participants||[]).join(', ')}</span>${d.modepay?'<span class="tag" style="background:#f0f2f5;color:#5A6475">'+d.modepay+'</span>':''}</div>
      </div>
      <button class="btn-del" data-id="${d.id}">✕</button>
    </div>`;
  }).join('');

  renderSoldes();
}

function renderSoldes() {
  const paye = {}, doit = {};
  PARTS.forEach(p => { paye[p] = 0; doit[p] = 0; });
  data.forEach(d => {
    const parts = d.participants && d.participants.length ? d.participants : PARTS;
    const m = d.montant;
    if (paye[d.payepar] !== undefined) paye[d.payepar] += m;
    parts.forEach(p => { if (doit[p] !== undefined) doit[p] += m / parts.length; });
  });
  let html = '';
  PARTS.forEach(p => {
    const s = paye[p] - doit[p];
    if (Math.abs(s) < 0.01) return;
    html += `<div class="solde-row"><span>${p}</span><span class="${s>0?'pos':'neg'}">${s>0?'+':''}${s.toFixed(2)} €</span></div>`;
  });
  const card = document.getElementById('soldes-card');
  if (!html) { card.style.display = 'none'; return; }
  document.getElementById('soldes').innerHTML = html;
  card.style.display = 'block';
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
  log(msg);
}

function log(msg) {
  const d = document.getElementById('debug');
  const line = document.createElement('div');
  line.textContent = new Date().toLocaleTimeString() + ' ' + msg;
  d.insertBefore(line, d.firstChild);
}
</script>
</body>
</html>
